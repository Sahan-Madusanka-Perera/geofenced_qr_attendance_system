name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DB_NAME: attendance_db
  DB_USER: admin
  DB_PASSWORD: attendance_secret_2024

jobs:
  # ---------------------------------------------------------------------
  # Unit tests: pure logic, no database needed. Fails fast and cheaply.
  # ---------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run unit tests
        working-directory: server
        env:
          JWT_SECRET: ci-unit-test-secret
        run: npm run test:unit

  # ---------------------------------------------------------------------
  # Integration tests: migrations applied to a real PostGIS instance,
  # then the geofence and device-binding rules exercised against it.
  # ---------------------------------------------------------------------
  integration:
    name: Migrations + integration tests
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: attendance_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: attendance_secret_2024
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d attendance_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Wait for the database to accept connections
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U "$DB_USER" -d "$DB_NAME"; then
              echo "database is ready"
              exit 0
            fi
            echo "waiting for postgres ($i/30)..."
            sleep 2
          done
          echo "::error::database never became ready"
          exit 1

      - name: Enable PostGIS extensions
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          psql -h localhost -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -f db/docker-init/00-create-extensions.sql

      - name: Apply schema migrations
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          for migration in db/migrations/*.sql; do
            echo "--> applying $migration"
            psql -h localhost -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify migrations are idempotent
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          psql -h localhost -U "$DB_USER" -d "$DB_NAME" -v ON_ERROR_STOP=1 \
            -f db/migrations/002_seed.sql

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run integration tests
        working-directory: server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: ci-integration-test-secret
        run: npm test

  # ---------------------------------------------------------------------
  # Frontend: lint and production build.
  # ---------------------------------------------------------------------
  client:
    name: Client lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      # Advisory for now: a backlog of react-hooks findings is being worked
      # down. Reported on every run, but does not block the pipeline.
      - name: Lint (advisory)
        working-directory: client
        continue-on-error: true
        run: npm run lint

      - name: Build
        working-directory: client
        run: npm run build

  # ---------------------------------------------------------------------
  # Validate the compose stack builds and comes up healthy.
  # ---------------------------------------------------------------------
  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for the container healthcheck to pass
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' qr_attendance_db)
            echo "healthcheck status: $status ($i/30)"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "::error::container never reported healthy"
          docker compose logs
          exit 1

      - name: Apply migrations inside the container
        run: |
          for migration in db/migrations/*.sql; do
            echo "--> applying $migration"
            docker exec -i qr_attendance_db \
              psql -U admin -d attendance_db -v ON_ERROR_STOP=1 < "$migration"
          done

      # The same script used to monitor the stack in operation, reused here so
      # CI verifies the probes themselves still work.
      - name: Probe the deployed stack
        run: ./scripts/healthcheck.sh --skip-api

      - name: Emit machine-readable health report
        run: ./scripts/healthcheck.sh --skip-api --json | tee health-report.json

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: stack-health-report
          path: health-report.json

      - name: Tear down
        if: always()
        run: docker compose down -v
